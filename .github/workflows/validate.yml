# Checks the marketplaces and every plugin the way Claude Code and Codex load them, that both sets of manifests agree,
# and that the report summary still reads the JSON both packages write today.
name: Validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The Claude Code and Codex manifests agree
        run: node scripts/check-manifests.mjs
      - run: npm install -g @anthropic-ai/claude-code @openai/codex
      - run: claude plugin validate . --strict
      - name: Validate every plugin
        run: for p in plugins/*/; do claude plugin validate "$p" --strict; done
      - name: Codex installs every plugin with its skills
        env:
          CODEX_HOME: ${{ runner.temp }}/codex
        run: |
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$PWD"
          for p in plugins/*/; do
            name=$(basename "$p")
            codex plugin add "$name@albibikov"
            codex plugin list | grep -E "^$name@albibikov +installed"
            for s in "$p"skills/*/; do test -f "$CODEX_HOME/plugins/cache/albibikov/$name/"*/skills/$(basename "$s")/SKILL.md; done
          done
      # site-audit: the server script starts and stops a site, and the report summary still reads the JSON both packages
      # write today.
      - name: site-audit summarizes real reports
        run: |
          mkdir -p reports
          cat > reports/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><title>Example page for the audit</title></head>
          <body><main><h1>Example page for the audit</h1><p>Some text for the audit to read.</p></main></body></html>
          HTML
          node plugins/site-audit/scripts/serve.mjs start --port 3456 -- npx --yes serve reports -l 3456
          npx --yes search-auditor@latest http://127.0.0.1:3456 --json --out seo.json --fail-on never >/dev/null
          npx --yes ai-search-auditor@latest http://127.0.0.1:3456 --json --out geo.json --fail-on never >/dev/null
          node plugins/site-audit/scripts/summarize.mjs seo.json --all
          node plugins/site-audit/scripts/summarize.mjs geo.json --all
          node plugins/site-audit/scripts/serve.mjs stop --port 3456